name: Build and Distribute (Prod)

on:
  push:
    branches:
      - master
      - ci-test
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build prod release APK and distribute via Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Write Firebase App Distribution service account credentials
        env:
          FIREBASE_APP_DISTRIBUTION_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS_BASE64 }}
        run: echo "$FIREBASE_APP_DISTRIBUTION_CREDENTIALS_BASE64" | base64 -d > app/ai-audio-book-2c2ff064ff10.json

      - name: Write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ai-audio-book-keystore

      - name: Write signing config to local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD" >> local.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS" >> local.properties
          printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build prod release APK
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 30

      - name: Distribute prod release via Firebase App Distribution
        run: ./gradlew appDistributionUploadProdRelease --no-daemon
